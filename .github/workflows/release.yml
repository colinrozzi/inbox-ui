name: Release

# Triggered by pushing a `release-YYYYMMDD-<sha>` tag (or manually). Builds
# each actor as a packr 0.11.0 PLAIN cdylib (`cargo build`), verifies its
# import surface is host-only, and uploads the bare <name>.wasm + sentinel
# sub-manifest templates as release assets. No compose step (packr 0.11.0
# retired composition); the plain wasm is directly loadable.
#
# Sentinel consumes these as its `children.inbox-ui` config:
#   default_package    = .../inbox-ui-acceptor-<stage>.wasm
#   manifest_template  = .../inbox-ui-acceptor-<stage>.toml  (__PACKAGE__/__BEARER_TOKEN__/... substituted at deploy)
# The acceptor's UI_HANDLER_MANIFEST is set to inbox-ui-handler-<stage>.toml,
# whose __PACKAGE__ is self-referenced here to inbox-ui-handler-<stage>.wasm.

on:
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build plain wasms + tag + upload artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: cargo build --release (plain cdylib) both actors
        run: |
          set -euo pipefail
          for a in ui-acceptor ui-handler; do
            echo "::group::cargo build $a"
            nix develop --command bash -c "cd $a && cargo build --target wasm32-unknown-unknown --release"
            echo "::endgroup::"
          done

      - name: Assert both wasms are self-contained (host-only imports)
        run: |
          set -euo pipefail
          for a in ui-acceptor ui-handler; do
            m=${a//-/_}
            W="$a/target/wasm32-unknown-unknown/release/${m}.wasm"
            test -f "$W" || { echo "::error::wasm not built: $W"; exit 1; }
            nix develop --command wasm-tools validate "$W"
            bad=$(nix develop --command bash -c "wasm-tools print '$W' | grep -E '^[[:space:]]*\\(import ' | grep -v 'theater:simple/' || true")
            if [ -n "$bad" ]; then echo "::error::$a has non-host imports (recipe not applied):"; echo "$bad"; exit 1; fi
            echo "$a self-contained: $W ($(stat -c%s "$W") bytes)"
          done

      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            DATE=$(date +%Y%m%d)
            SHA=$(git rev-parse --short=7 HEAD)
            TAG="release-$DATE-$SHA"
            git tag "$TAG"
            git push origin "$TAG"
          fi

          gh release create "$TAG" --generate-notes

          STAGE_TAG="${TAG#release-}"
          ASSETS=()

          # Per-actor plain wasms — stage-tagged, stable URL.
          cp "ui-acceptor/target/wasm32-unknown-unknown/release/ui_acceptor.wasm" \
             "inbox-ui-acceptor-${STAGE_TAG}.wasm"
          cp "ui-handler/target/wasm32-unknown-unknown/release/ui_handler.wasm" \
             "inbox-ui-handler-${STAGE_TAG}.wasm"
          ASSETS+=("inbox-ui-acceptor-${STAGE_TAG}.wasm" "inbox-ui-handler-${STAGE_TAG}.wasm")

          # Sentinel sub-manifest templates.
          #  - ui-acceptor is the sentinel child: __PACKAGE__ (+ secrets) are
          #    substituted by the deploy step; ship as-is.
          #  - ui-handler is resolved by the acceptor via the UI_HANDLER_MANIFEST
          #    URL, so nothing downstream substitutes its __PACKAGE__ — self-ref
          #    it to the handler wasm here.
          HANDLER_WASM_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/inbox-ui-handler-${STAGE_TAG}.wasm"
          cp "sentinel/ui-acceptor.template.toml" "inbox-ui-acceptor-${STAGE_TAG}.toml"
          sed "s#__PACKAGE__#${HANDLER_WASM_URL}#" \
             "sentinel/ui-handler.template.toml" > "inbox-ui-handler-${STAGE_TAG}.toml"
          ASSETS+=("inbox-ui-acceptor-${STAGE_TAG}.toml" "inbox-ui-handler-${STAGE_TAG}.toml")

          gh release upload "$TAG" "${ASSETS[@]}"

          echo "Released $TAG with assets:"
          printf '  %s\n' "${ASSETS[@]}"
