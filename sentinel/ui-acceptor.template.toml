# Sentinel-managed deploy template for ui-acceptor.
#
# Frontdoor-cutover edition: this actor terminates TLS on its loopback
# socket so frontdoor at :443 can SNI-route inbox.colinrozzi.com and
# forward the STILL-ENCRYPTED stream to 127.0.0.1:9443 (frontdoor is a
# pure SNI router — it does NOT terminate TLS). It is spawned as the named
# in-theater child "inbox-ui" under the clean multi-child sentinel
# (Topology B). Spawn-on-init; crash -> respawn (rate-limited); external
# stop -> no respawn.
#
# (The Phase A bring-up ran this same child as PLAIN HTTP on the loopback
# socket — no server_tls, no cert — so it didn't block on cert
# provisioning. This edition re-adds server_tls for the public-URL
# cutover; see "TLS TERMINATION" below.)
#
# The deploy step renders this template by literal substring substitution
# of the placeholders below (each wrapped in doubled underscores) from the
# per-child config, and writes the concrete manifest onto the box for
# sentinel to spawn by path:
#
#   children: {
#     "inbox-ui": {
#       manifest_template: <contents of this file>,
#       default_package:   "<canonical inbox-ui-acceptor.wasm URL>",
#       secrets: {
#         "BEARER_TOKEN":         "...",     # API bearer for reads + sends
#         "BASIC_AUTH":           "...",     # "<user>:<password>"
#         "API_BASE_URL":         "https://mail.colinrozzi.com:443",
#         "UI_HANDLER_MANIFEST":  "<https URL of inbox-ui-handler-*.toml>",
#         "CERT_PATH":            "/etc/letsencrypt/live/inbox.colinrozzi.com/fullchain.pem",
#         "KEY_PATH":             "/etc/letsencrypt/live/inbox.colinrozzi.com/privkey.pem"
#       }
#     }
#   }
#
# OPERATOR NOTE — BASIC_AUTH FORMAT:
#   Plain "<user>:<password>". HTTP Basic header decodes to exactly this
#   string for a successful match. v0 is single-credential — replace
#   before a second user exists.
#
# OPERATOR NOTE — API_BASE_URL:
#   Points at the inbox API. Production = "https://mail.colinrozzi.com:443".
#   The ui-handler opens an outbound TLS connection to this address for
#   reads and writes (its own [handler.client_tls], see
#   ui-handler.template.toml). If the inbox API moves behind a different
#   hostname/port, this is the field to update.
#
# OPERATOR NOTE — UI_HANDLER_MANIFEST:
#   Opaque theater resolve_reference for the ui-handler sub-manifest.
#   For sentinel-managed deploy use the https:// release-asset URL of
#   `inbox-ui-handler-<release>.toml` from this repo's releases.
#
# LISTEN ADDRESS:
#   ui-acceptor binds 127.0.0.1:9443 (hardcoded, see ui-acceptor/src/lib.rs).
#   Loopback-only: frontdoor forwards to 127.0.0.1:9443 and nothing else
#   should reach it directly. Readiness: an unauthenticated `GET /healthz`
#   returns 200 "ok" (it spawns a handler and replies without touching the
#   store or upstream API) — health-gate on that. Note the probe must speak
#   TLS now (https), since the socket terminates TLS (see below).
#
# TLS TERMINATION — CERT_PATH / KEY_PATH:
#   The [handler.server_tls] block below makes theater terminate TLS on the
#   loopback socket using the cert+key at the operator-provided paths. The
#   accept loop performs the handshake automatically (bounded 10s timeout,
#   off the accept loop per theater #132) and hands the ui-handler an
#   already-decrypted stream — no actor code change vs the plain build.
#   The cert MUST cover the SNI hostname clients type — inbox.colinrozzi.com
#   — so the browser's TLS handshake (completed at THIS backend, after
#   frontdoor's opaque pass-through) validates. Provision a Let's Encrypt
#   cert for inbox.colinrozzi.com at the CERT_PATH/KEY_PATH paths before the
#   cutover window; theater reads both as PEM files at spawn.
#
# WHY initial_state IS A SINGLE-LINE TOML LITERAL:
#   Sentinel embeds this entire template as a STRING value in its own
#   outer manifest, which itself uses TOML triple-quote literal syntax.
#   Inner triple-quotes would close the outer string early. Same operator
#   note exists in inbox-acceptor.template.toml.

name = "inbox-ui-acceptor"
version = "0.1.0"
package = "__PACKAGE__"
initial_state = '{"bearer_token":"__BEARER_TOKEN__","basic_auth":"__BASIC_AUTH__","api_base_url":"__API_BASE_URL__","ui_handler_manifest":"__UI_HANDLER_MANIFEST__"}'

[[handler]]
type = "runtime"

# TLS-terminating listener on 127.0.0.1:9443. theater performs the server
# handshake automatically using the cert+key below (see "TLS TERMINATION").
[[handler]]
type = "tcp"

[handler.server_tls]
enabled = true
cert = "__CERT_PATH__"
key = "__KEY_PATH__"

# ui-acceptor spawns a fresh ui-handler child per connection.
[[handler]]
type = "supervisor"

[[handler]]
type = "rpc"

# Shared store with inbox-acceptor — the acceptor writes the bearer +
# basic-auth secrets here at init; each ui-handler reads them back.
[[handler]]
type = "store"
base_path = "/mnt/main-volume/inbox/store"
store_id = "inbox"
