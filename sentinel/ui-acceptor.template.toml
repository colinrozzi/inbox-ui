# Sentinel-managed deploy template for ui-acceptor.
#
# Phase A (current): a single clean multi-child sentinel spawns this actor
# as the named in-theater child "inbox-ui" (Topology B, per sentinel-dev
# id=17). Spawn-on-init; crash -> respawn (rate-limited); external stop ->
# no respawn. No public routing yet — bring-up order is UIs first, then
# frontdoor, then the public-routing cutover.
#
# Sentinel renders this template by literal substring substitution of the
# placeholders below (each wrapped in doubled underscores) from its
# per-child config at every spawn:
#
#   children: {
#     "inbox-ui": {
#       manifest_template: <contents of this file>,
#       default_package:   "<canonical inbox-ui-acceptor.wasm URL>",
#       secrets: {
#         "BEARER_TOKEN":         "...",     # API bearer for reads + sends
#         "BASIC_AUTH":           "...",     # "<user>:<password>"
#         "API_BASE_URL":         "https://mail.colinrozzi.com:443",
#         "UI_HANDLER_MANIFEST":  "<https URL of inbox-ui-handler-*.toml>"
#       }
#     }
#   }
#
# OPERATOR NOTE — BASIC_AUTH FORMAT:
#   Plain "<user>:<password>". HTTP Basic header decodes to exactly this
#   string for a successful match. v0 is single-credential — replace
#   before a second user exists.
#
# OPERATOR NOTE — API_BASE_URL:
#   Points at the inbox API. Production = "https://mail.colinrozzi.com:443".
#   The ui-handler opens an outbound TLS connection to this address for
#   reads and writes (its own [handler.client_tls], see
#   ui-handler.template.toml). If the inbox API moves behind a different
#   hostname/port, this is the field to update.
#
# OPERATOR NOTE — UI_HANDLER_MANIFEST:
#   Opaque theater resolve_reference for the ui-handler sub-manifest.
#   For sentinel-managed deploy use the https:// release-asset URL of
#   `inbox-ui-handler-<release>.toml` from this repo's releases.
#
# LISTEN ADDRESS:
#   ui-acceptor binds 127.0.0.1:9443 (hardcoded, see ui-acceptor/src/lib.rs).
#   Loopback-only and plain HTTP in Phase A — nothing outside the host
#   reaches it. Readiness: an unauthenticated `GET /healthz` returns 200
#   "ok" (it spawns a handler and replies without touching the store or
#   upstream API), which is what sentinel should health-gate on.
#
# DEFERRED TO THE FRONTDOOR-CUTOVER PHASE (not Phase A):
#   When frontdoor at :443 SNI-routes inbox.colinrozzi.com -> 127.0.0.1:9443,
#   this actor will terminate TLS on that socket. That needs (a) a cert
#   covering inbox.colinrozzi.com provisioned on the host, and (b) a
#   [handler.server_tls] block here wired to CERT_PATH/KEY_PATH secrets.
#   Both are intentionally omitted now so Phase A does not block on cert
#   provisioning. Re-add at the cutover.
#
# WHY initial_state IS A SINGLE-LINE TOML LITERAL:
#   Sentinel embeds this entire template as a STRING value in its own
#   outer manifest, which itself uses TOML triple-quote literal syntax.
#   Inner triple-quotes would close the outer string early. Same operator
#   note exists in inbox-acceptor.template.toml.

name = "inbox-ui-acceptor"
version = "0.1.0"
package = "__PACKAGE__"
initial_state = '{"bearer_token":"__BEARER_TOKEN__","basic_auth":"__BASIC_AUTH__","api_base_url":"__API_BASE_URL__","ui_handler_manifest":"__UI_HANDLER_MANIFEST__"}'

[[handler]]
type = "runtime"

# Plain-HTTP listener on 127.0.0.1:9443 in Phase A. No [handler.server_tls]
# yet — see "DEFERRED TO THE FRONTDOOR-CUTOVER PHASE" above.
[[handler]]
type = "tcp"

# ui-acceptor spawns a fresh ui-handler child per connection.
[[handler]]
type = "supervisor"

[[handler]]
type = "rpc"

# Shared store with inbox-acceptor — the acceptor writes the bearer +
# basic-auth secrets here at init; each ui-handler reads them back.
[[handler]]
type = "store"
base_path = "/mnt/main-volume/inbox/store"
store_id = "inbox"
