# Sentinel-managed deploy template for ui-handler. One actor is spawned
# per inbound TCP connection by ui-acceptor; this template configures
# its runtime, store access, and outbound-TLS capability for the
# read/write API calls.

name = "inbox-ui-handler"
version = "0.1.0"
package = "__PACKAGE__"

[[handler]]
type = "runtime"

# tcp covers both the inbound transferred connection (from ui-acceptor)
# and the outbound connect() to the inbox API for every read
# (GET /v1/mailboxes/...) and write (POST .../send).
[[handler]]
type = "tcp"

# client_tls enables outbound TLS. With auto_handshake on (the default),
# connect() to the https inbox API returns an already-encrypted stream;
# the handler does NOT call upgrade-to-tls-client. Without this block the
# handler cannot open TLS to mail.colinrozzi.com and every read/write 500s
# ("client_tls not configured on this handler"). Mirrors the inbox CLI.
[handler.client_tls]
enabled = true

[[handler]]
type = "rpc"

# Shared store with inbox-acceptor — pulls the bearer + basic-auth
# secrets the acceptor wrote at init.
[[handler]]
type = "store"
base_path = "/mnt/main-volume/inbox/store"
store_id = "inbox"
