# Sentinel-managed deploy template for ui-handler. One actor is spawned
# per inbound TCP connection by ui-acceptor; this template configures
# its runtime, store access, and outbound-TLS capability for the
# /api/send call.

name = "ui-handler"
version = "0.1.0"
package = "__PACKAGE__"

[[handler]]
type = "runtime"

# tcp covers both the inbound transferred connection and the outbound
# connect()+upgrade-to-tls-client to the API for /api/send.
[[handler]]
type = "tcp"

[[handler]]
type = "rpc"

# Shared store with inbox-acceptor — we read mailbox/message data from
# here and pull the bearer + basic-auth secrets the acceptor wrote at
# init.
[[handler]]
type = "store"
base_path = "/mnt/main-volume/inbox/store"
store_id = "inbox"
