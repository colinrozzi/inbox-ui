# Local-dev manifest for ui-handler. Spawned per-connection by ui-acceptor.
#
# `package` points at the plain packr 0.11.0 cdylib. Build it with
# `cargo build --target wasm32-unknown-unknown --release`.
#
# The sentinel-rendered production manifest is at
# sentinel/ui-handler.template.toml.
name = "ui-handler"
version = "0.1.0"
package = "target/wasm32-unknown-unknown/release/ui_handler.wasm"

[[handler]]
type = "runtime"

[[handler]]
type = "tcp"

# Outbound TLS to the inbox API (auto-handshake at connect()).
[handler.client_tls]
enabled = true

[[handler]]
type = "rpc"

[[handler]]
type = "store"
base_path = "/tmp/inbox-ui-dev-store"
store_id = "inbox"
