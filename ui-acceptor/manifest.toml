# Local-dev manifest for ui-acceptor. Plain HTTP on 127.0.0.1:9443.
#
# `package` points at the self-contained COMPOSITE (packr 0.10.2): a bare
# cargo member is not loadable by theater's 0.10.x loader. Build it with
# `theater build --release ui-acceptor` (composes member + allocator, then
# rewrites this field to the absolute composite path — expected; not committed).
#
# The sentinel-rendered production manifest lives at
# sentinel/ui-acceptor.template.toml (server_tls + secrets substituted).
name = "ui-acceptor"
version = "0.1.0"
package = "target/wasm32-unknown-unknown/release/ui_acceptor.composite.wasm"

[[handler]]
type = "runtime"

[[handler]]
type = "tcp"

[[handler]]
type = "supervisor"

[[handler]]
type = "rpc"

[[handler]]
type = "store"
base_path = "/tmp/inbox-ui-dev-store"
store_id = "inbox"
