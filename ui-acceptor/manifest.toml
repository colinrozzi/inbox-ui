# Local-dev manifest for ui-acceptor. Plain HTTP on 127.0.0.1:9443.
#
# The sentinel-rendered production manifest lives at
# sentinel/ui-acceptor.template.toml. In Phase A it is also plain HTTP on
# the loopback socket (just with the package path replaced by the release
# artifact URL + secrets substituted); [handler.server_tls] gets added
# only at the later frontdoor-cutover phase.
name = "ui-acceptor"
version = "0.1.0"
package = "target/wasm32-unknown-unknown/release/ui_acceptor.wasm"

[[handler]]
type = "runtime"

[[handler]]
type = "tcp"

[[handler]]
type = "supervisor"

[[handler]]
type = "rpc"

[[handler]]
type = "store"
base_path = "/tmp/inbox-ui-dev-store"
store_id = "inbox"
