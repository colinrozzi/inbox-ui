# Local-dev manifest for ui-acceptor. Plain HTTP on 127.0.0.1:9443.
#
# `package` points at the plain packr 0.11.0 cdylib. Build it with
# `cargo build --target wasm32-unknown-unknown --release` (the two link-args
# in .cargo/config.toml make it directly loadable — no compose step).
#
# The sentinel-rendered production manifest lives at
# sentinel/ui-acceptor.template.toml (server_tls + secrets substituted).
name = "ui-acceptor"
version = "0.1.0"
package = "target/wasm32-unknown-unknown/release/ui_acceptor.wasm"

[[handler]]
type = "runtime"

[[handler]]
type = "tcp"

[[handler]]
type = "supervisor"

[[handler]]
type = "rpc"

[[handler]]
type = "store"
base_path = "/tmp/inbox-ui-dev-store"
store_id = "inbox"
