[target.wasm32-unknown-unknown]
# Plain self-contained build (packr 0.11.0): setup_guest!() links dlmalloc into
# the cdylib, so it exports its own GROWABLE memory + __pack_alloc/__pack_free +
# lifecycle and imports only host theater:simple/*. No compose step, no
# fixed-base/PIC recipe. See theater docs/self-contained-actor-recipe.md.
rustflags = [
    "-C", "link-arg=--export-memory",
    "-C", "link-arg=--no-entry",
]
